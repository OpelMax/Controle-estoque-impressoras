# Gera o APK Android a cada atualização e publica em Releases.
# Link fixo da versão mais nova:
# https://github.com/OpelMax/Controle-estoque-impressoras/releases/latest/download/controle-estoque.apk
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk controle-estoque.apk

      - uses: actions/upload-artifact@v4
        with:
          name: controle-estoque-apk
          path: controle-estoque.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" controle-estoque.apk \
            --title "Versão 1.0.${{ github.run_number }}" \
            --notes "Baixe o arquivo controle-estoque.apk abaixo e abra no celular Android." \
            --latest
